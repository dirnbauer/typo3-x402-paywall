<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

<f:asset.script identifier="x402-simulator" src="{f:uri.resource(path: 'JavaScript/simulator.js')}" type="module" />

<div id="x402-simulator"
     data-run-url="{be:uri.moduleAction(action: 'runSimulation', moduleName: 'web_x402_paywall')}"
     data-label-run="{f:translate(key: 'LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.run')}"
     data-label-running="{f:translate(key: 'LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.running')}"
     data-label-error="{f:translate(key: 'LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.error')}"
     data-label-waiting-request="{f:translate(key: 'LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.waiting_request')}"
     data-label-waiting-response="{f:translate(key: 'LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.waiting_response')}">

    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="sim-scenario">
                        <f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.scenario" />
                    </label>
                    <select id="sim-scenario" class="form-select form-select-sm">
                        <f:for each="{scenarios}" as="scenario">
                            <option value="{scenario.id}"
                                    data-url="{scenario.url}"
                                    data-signature="{scenario.signature}"
                                    data-description="{scenario.description}">
                                {scenario.label}
                            </option>
                        </f:for>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="sim-url">
                        <f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.url" />
                    </label>
                    <input id="sim-url" type="url" class="form-control form-control-sm" value="{scenarios.0.url}" />
                </div>
                <div class="col-md-2">
                    <button id="sim-run" type="button" class="btn btn-primary btn-sm w-100">
                        <f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.run" />
                    </button>
                </div>
            </div>
            <p id="sim-desc" class="text-muted mb-0 mt-2">{scenarios.0.description}</p>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <h2 class="card-title mb-0">
                        <f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.request" />
                    </h2>
                </div>
                <div class="card-body">
                    <pre id="panel-request" class="mb-0"><f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.waiting_request" /></pre>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <h2 class="card-title mb-0">
                        <f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.response" />
                    </h2>
                </div>
                <div class="card-body">
                    <pre id="panel-response" class="mb-0"><f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.waiting_response" /></pre>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-requirement-wrap" class="card mt-3" hidden>
        <div class="card-header">
            <h2 class="card-title mb-0">
                <f:translate key="LLL:EXT:x402_paywall/Resources/Private/Language/locallang_mod.xlf:simulator.requirement" />
            </h2>
        </div>
        <div class="card-body">
            <pre id="panel-requirement" class="mb-0"></pre>
        </div>
    </div>
</div>

</f:section>
</html>
