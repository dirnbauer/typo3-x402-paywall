name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lint, CGL, PHPStan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, pdo_sqlite, sodium, sqlite3, xml, zip

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Lint
        run: Build/Scripts/runTests.sh -s lint

      - name: XLIFF well-formed
        run: |
          php -r 'libxml_use_internal_errors(true); $failed = false; foreach (array_merge(glob("Resources/Private/Language/*.xlf"), glob("Resources/Private/Language/*/*.xlf")) as $file) { if (simplexml_load_file($file) === false) { $failed = true; foreach (libxml_get_errors() as $error) { fwrite(STDERR, $file . ":" . $error->line . ": " . trim($error->message) . PHP_EOL); } libxml_clear_errors(); } } exit($failed ? 1 : 0);'

      - name: Coding guidelines (php-cs-fixer, TYPO3 ruleset, dry run)
        run: Build/Scripts/runTests.sh -s cgl

      - name: PHPStan
        run: Build/Scripts/runTests.sh -s phpstan

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, pdo_sqlite, sodium, sqlite3, xml, zip

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests
        run: Build/Scripts/runTests.sh -s unit

  functional:
    name: Functional tests (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: func_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, mysqli, pdo_sqlite, sodium, sqlite3, xml, zip
          ini-values: memory_limit=1G

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Functional tests
        run: Build/Scripts/runTests.sh -s functional -d ${{ matrix.database }}
