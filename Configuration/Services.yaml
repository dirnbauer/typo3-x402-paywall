services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # MCP tools are discovered by hn/typo3-mcp-server through the "mcp.tool" tag
  # (x402_probe, x402_decode_header, x402_gated_pages, x402_stats, x402_transactions).
  _instanceof:
    Webconsulting\X402Paywall\Mcp\Tool\AbstractMcpTool:
      public: true
      tags:
        - name: mcp.tool

  Webconsulting\X402Paywall\:
    resource: '../src/*'

  Webconsulting\X402Paywall\Middleware\X402PaywallMiddleware:
    public: true
