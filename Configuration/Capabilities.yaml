capabilities:
  version: "1.0"
  subsystems:
    - database:read
    - database:write
    - database:schema
    - site:middleware
    - backend:module
    - tca:override
  database:
    own_tables:
      - tx_x402_payment_log
    reads:
      - pages
    writes:
      - tx_x402_payment_log
  network:
    outbound:
      - host: "x402.org"
        purpose: "Default x402 facilitator (testnets only): POST /verify, POST /settle, GET /supported"
        protocol: "https"
      - host: "api.cdp.coinbase.com"
        purpose: "Coinbase Developer Platform x402 facilitator (facilitator_auth: cdp): POST /verify, POST /settle, GET /supported"
        protocol: "https"
      - host: "*"
        purpose: "Any other facilitator_url configured for a site; backend simulator probes of the site itself or public URLs"
        protocol: "https"
  events:
    dispatches:
      - Webconsulting\X402Paywall\Event\PaymentRequiredEvent
      - Webconsulting\X402Paywall\Event\PaymentReceivedEvent
  risk:
    level: "medium"
    justification: "Frontend middleware answering 402, outbound facilitator calls (optionally signed with a CDP API key), writes a payment log"
