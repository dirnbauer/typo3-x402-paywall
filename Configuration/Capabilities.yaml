capabilities:
  version: "1.0"
  subsystems:
    - database:read
    - database:write
    - database:schema
    - site:middleware
    - backend:module
    - tca:override
  database:
    own_tables:
      - tx_x402_payment_log
    reads:
      - pages
    writes:
      - tx_x402_payment_log
  network:
    outbound:
      - host: "x402.org"
        purpose: "x402 facilitator (configurable): POST /verify, POST /settle, GET /supported"
        protocol: "https"
  events:
    dispatches:
      - Webconsulting\X402Paywall\Event\PaymentRequiredEvent
      - Webconsulting\X402Paywall\Event\PaymentReceivedEvent
  risk:
    level: "medium"
    justification: "Frontend middleware answering 402, outbound facilitator calls, writes a payment log"
