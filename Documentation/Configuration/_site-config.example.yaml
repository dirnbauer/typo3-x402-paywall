# config/sites/<site-identifier>/config.yaml
base: https://www.example.com
languages:
  - title: English
    languageId: 0
    locale: en_US.UTF-8
    base: /

x402_paywall:
  enabled: true
  wallet_address: "0xYOUR_WALLET_ADDRESS"       # receives the payments
  network: base-sepolia                          # alias or CAIP-2 id such as eip155:8453
  facilitator_url: https://x402.org/facilitator  # /verify, /settle, /supported are appended
  currency: USDC
  default_price: "0.01"                          # decimal, in the asset's units
  # asset_address: "0x..."                       # token contract (empty: USDC of the network)
  # asset_decimals: 6
  # asset_name: "USD Coin"                       # EIP-712 domain name of the token
  # asset_version: "2"                           # EIP-712 domain version of the token
  max_timeout_seconds: 300                       # validity of a signed authorization
  free_routes: ["/", "/api/v1/health", "/api/v1/public/*"]
  gated_route_patterns: ["/api/v1/content/*"]
  gated_page_uids: []
  legacy_v1: false                               # also accept x402 v1 clients
